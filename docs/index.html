<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartes généralisées · Corrigés du TP</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="course">TP DE MODÉLISATION GÉOMÉTRIQUE</p>
      <h1>Cartes généralisées</h1>
      <p>Retrouve les consignes du TP et les corrigés dévoilés pendant la séance.</p>
      <a href="https://github.com/fredboudon/gmap_exercise#readme">Lire le sujet complet</a>
    </header>
    <section aria-labelledby="questions-title">
      <div class="section-title">
        <h2>Questions du TP</h2>
        <button type="button" id="refresh">Actualiser les corrigés</button>
      </div>
      <p id="status" role="status"></p>
      <div id="questions"></div>
      <noscript>Active JavaScript pour afficher la liste des questions et des corrigés.</noscript>
    </section>
  </main>
</body>
</html>
